name: warehouse_app
description: Warehouse management mobile application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.1
  drift: ^2.21.0
  drift_flutter: ^0.2.1
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  mobile_scanner: ^5.2.3
  permission_handler: ^12.0.1
  flutter_local_notifications: ^18.0.1
  connectivity_plus: ^6.1.0
  signature: ^5.5.0
  wakelock_plus: ^1.2.0
  vibration: ^3.1.8
  http: ^1.6.0
  uuid: ^4.6.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  drift_dev: ^2.21.0
  riverpod_generator: ^2.6.1
  mocktail: ^1.0.4
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  device_info_plus: 12.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
  fonts:
    # Variable font (weights 200-800); set the weight with FontVariation('wght', n) as well as fontWeight.
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans[wght].ttf
    # App-wide (2026-10-23, direction A of the type study): static weights cut from the variable IBM Plex Sans, so a
    # plain fontWeight picks the right file. OFL; licence in assets/fonts/OFL-IBMPlex.txt.
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    # Codes: SKUs, barcodes, bins, PO and order numbers.
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/atura_icon.png"
  background_color: "#003439"
  adaptive_icon_background: "#003439"
  adaptive_icon_foreground: "assets/branding/atura_icon_foreground.png"
