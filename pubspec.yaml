name: warehouse_app
description: Warehouse management mobile application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.1
  drift: ^2.21.0
  drift_flutter: ^0.2.1
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  mobile_scanner: ^5.2.3
  permission_handler: ^12.0.1
  flutter_local_notifications: ^18.0.1
  connectivity_plus: ^6.1.0
  signature: ^5.5.0
  wakelock_plus: ^1.2.0
  vibration: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  drift_dev: ^2.21.0
  riverpod_generator: ^2.6.1
  mocktail: ^1.0.4
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
